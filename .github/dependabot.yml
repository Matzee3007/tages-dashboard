# Dependabot öffnet PRs, wenn Pakete oder Actions eine neue Version haben. Jeder PR läuft durch die CI.
# Einrichtung und Ablauf: docs/tools/Dependabot - Einrichtung.md
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Neue Versionen erst nach 7 Tagen vorschlagen: Manipulierte fallen oft in den ersten Tagen auf.
    # Gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 7
    # Familien, die nur zusammen gehen, kommen auch bei großen Updates (major) in einem PR.
    # Sonst: kleine Updates (minor, patch) gesammelt, große einzeln.
    groups:
      next:
        patterns: [next, eslint-config-next]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      # Ausschluss, weil React in musik-app trotz eigener Gruppe im Sammel-PR landete
      npm-klein:
        update-types: [minor, patch]
        exclude-patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Die Typen folgen der Laufzeit Node 24 (engines in package.json), nicht der neuesten Node-Version
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint verlangt TypeScript unter 6.1, ein PR auf TypeScript 7 könnte nicht grün werden
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Die ESLint-Plugins von eslint-config-next erlauben nur ESLint bis 9
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
