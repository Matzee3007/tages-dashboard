<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Runde 2: Aussehen Tages-Dashboard (D, E, F)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Commissioner:wght@300..800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#5f656e;font-family:system-ui,sans-serif;line-height:1.35;color:#111}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #8fc1ff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Mock-Rahmen (nicht Teil des Entwurfs) ---------- */
.mock-kopf{background:#262a31;color:#e9ecf0;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:5}
.mock-kopf h1{font-size:17px;font-weight:600}
.mock-kopf p{font-size:13px;color:#b5bcc6;max-width:900px}
.mock-kopf .beispiel{display:inline-block;background:#ffd166;color:#1f232a;font-weight:600;border-radius:4px;padding:0 6px;margin-right:6px}
.schalter{display:flex;flex-wrap:wrap;gap:8px 18px}
.schalter-gruppe{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px}
.schalter-gruppe>span{color:#b5bcc6;margin-right:4px}
.schalter-gruppe button{border:1px solid #4a505c;border-radius:8px;min-height:36px;padding:0 10px;font-size:13px;color:#e9ecf0}
.schalter-gruppe button.an{background:#e9ecf0;color:#1f232a;border-color:#e9ecf0;font-weight:600}
.variante-block{padding:28px 0 8px}
.variante-titel{max-width:1200px;margin:0 auto 12px;padding:0 16px;color:#fff}
.variante-titel h2{font-size:22px;font-weight:600}
.variante-titel p{font-size:14px;color:#eef0f3;max-width:820px}
.geraet{container:g / inline-size;margin:0 auto;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden}
.breite-1200 .geraet{max-width:1200px}
.breite-390 .geraet{max-width:390px}
.nur-eine .geraet{box-shadow:none}
.zust-hinweis{font:13px/1.4 system-ui,sans-serif;color:#aab;border-top:1px dashed #556;padding-top:10px}

/* ---------- Gemeinsam ---------- */
.kz{display:inline-grid;place-items:center;border-radius:50%;flex-shrink:0;font-style:normal;font-weight:600;background:var(--kz-grund);color:var(--kz-text);width:20px;height:20px;font-size:6.5px;letter-spacing:.02em;font-family:system-ui,sans-serif}
.team{display:inline-flex;align-items:center;gap:5px;min-width:0}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.neu-laden{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;font-size:20px;flex-shrink:0}
.vd .d-zf a,.ve .e-zf a,.vf .f-zf a{display:inline-flex!important;align-items:center;min-height:44px;margin-top:0!important}
.zf-knopf{display:inline-flex;align-items:center;gap:5px;min-height:44px;white-space:nowrap}
.zf-knopf svg{width:12px;height:12px;transition:transform .15s}
.zf-knopf[aria-expanded=true] svg{transform:rotate(180deg)}
.fehler-knopf{min-height:44px;padding:0 16px;margin-top:10px}

/* ================= D: Anzeigetafel ================= */
.vd{--grund:#0E1B2C;--tafel:#15263B;--led:#0A1522;--text:#F3F5EE;--ged:#8EA0B6;--rand:#24384F;--or:#FF8A3D;--or-grund:rgba(255,138,61,.13);--info:#7FB8FF;--fehler:#FF9A8F;--kz-grund:#243750;--kz-text:#D5DEEA;
  background:var(--grund);color:var(--text);font-family:Archivo,system-ui,sans-serif;line-height:1.35}
.vd .dash{padding:28px 24px 44px;display:flex;flex-direction:column;gap:40px}
.vd .d-kopf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.vd .d-datum{font-family:"Big Shoulders Display",sans-serif;font-weight:800;line-height:.9;font-size:64px}
.vd .d-datum span{display:block;font-size:26px;font-weight:600;color:var(--ged)}
.vd .d-rechts{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--ged)}
.vd .d-abm{min-height:44px;padding:0 16px;border:1px solid var(--rand);border-radius:4px;color:var(--text)}
.vd h2{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:40px;line-height:1}
.vd .d-gruppe{display:flex;flex-direction:column;gap:14px}
.vd .d-raster{display:grid;gap:16px;align-items:start}
@container g (min-width:900px){.vd .d-raster{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vd .d-kachel{background:var(--tafel);border-radius:4px;overflow:hidden;min-width:0}
.vd .d-band{background:var(--c);color:var(--mt);display:flex;align-items:center;gap:10px;padding:6px 4px 6px 16px;min-height:62px}
.vd .d-band h3{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:31px;line-height:1;flex:1;min-width:0}
.vd .d-nr{font-size:12.5px;font-weight:600;text-align:right;line-height:1.3}
.vd .d-tafel{background:var(--led);display:flex;flex-direction:column}
.vd .d-anz{padding:12px 16px 14px;border-top:1px solid var(--rand)}
.vd .d-anz:first-child{border-top:0}
.vd .d-anz.mein{box-shadow:inset 4px 0 0 var(--or);background:var(--or-grund)}
.vd .d-status{font-size:13px;font-weight:600;color:var(--ged);margin-bottom:4px}
.vd .d-live{color:var(--or);display:inline-flex;align-items:center;gap:7px}
.vd .d-live i{width:9px;height:9px;border-radius:50%;background:var(--or);animation:puls 1.6s ease-in-out infinite}
@keyframes puls{50%{opacity:.25}}
.vd .d-team{display:flex;align-items:center;gap:10px;min-height:46px}
.vd .d-team .kz{width:32px;height:32px;font-size:9.5px}
.vd .d-team .name{flex:1;font-size:19px;font-weight:600}
.vd .d-team.ist-mein .name{color:var(--or)}
.vd .d-tor{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:48px;line-height:.85;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.vd .d-tore{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--ged);margin-top:6px;padding-left:42px}
.vd .d-liste{padding:4px 16px}
.vd .d-zeile{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;column-gap:8px;min-height:44px;padding:5px 0;border-top:1px solid var(--rand)}
.vd .d-zeile:first-child{border-top:0}
.vd .d-zeit{font-size:12.5px;color:var(--ged);white-space:nowrap}
.vd .d-paar{display:flex;align-items:center;gap:6px;min-width:0;font-size:14.5px;font-weight:500}
.vd .d-strich{color:var(--ged)}
.vd .d-erg{font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.vd .d-zeile .d-tore{grid-column:2/-1;padding-left:0;margin-top:2px;font-size:12.5px}
.vd .d-tab{padding:12px 16px 16px;border-top:1px solid var(--rand)}
.vd .d-tab>p{font-size:13px;color:var(--ged);margin-bottom:8px}
.vd .d-leiste{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:stretch}
.vd .d-zelle{width:50px;background:var(--led);border-radius:3px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.vd .d-zelle .pl{font-size:11.5px;color:var(--ged)}
.vd .d-zelle b{font-size:12.5px;font-weight:700;margin-top:2px}
.vd .d-zelle .pk{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:26px;line-height:1;margin-top:3px}
.vd .d-zelle .td{font-size:11px;color:var(--ged)}
.vd .d-zelle.mein{background:var(--or-grund);box-shadow:inset 0 3px 0 var(--or)}
.vd .d-zelle.mein b{color:var(--or)}
.vd .d-zelle.luecke{width:26px;background:none;justify-content:center;color:var(--ged)}
.vd .d-grenze{width:3px;border-radius:2px;background:var(--c);margin:0 3px}
.vd .d-fehlt,.vd .d-fehler p{font-size:14px;color:var(--ged)}
.vd .d-fehler{padding:16px;border-bottom:1px solid var(--rand)}
.vd .d-fehler b{color:var(--text)}
.vd .d-fehler .fehler-knopf{border:1px solid var(--rand);border-radius:4px;color:var(--text)}
.vd .d-gkopf{display:flex;align-items:center;justify-content:space-between}
.vd .d-ki{display:flex;flex-direction:column;gap:10px}
.vd .d-absender{display:grid;gap:0 36px}
@container g (min-width:900px){.vd .d-absender{grid-template-columns:1fr 1fr}}
.vd .d-abs{display:grid;grid-template-columns:140px minmax(0,1fr);column-gap:16px;padding:6px 0 12px;border-top:3px solid var(--c);min-width:0}
.vd .d-abs h3{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:25px;line-height:1.02;color:var(--c);padding-top:12px}
.vd .d-abs h3 i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--m);margin-right:7px;vertical-align:.12em}
.vd .d-m+.d-m{border-top:1px solid var(--rand)}
.vd .d-mz{display:flex;align-items:center;gap:10px}
.vd .d-ml{flex:1;display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;padding:6px 0}
.vd .d-neu{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vd .d-neu.ja{background:var(--or)}
.vd .d-mt{font-size:15px;font-weight:500}
.vd .d-ma{font-size:12.5px;color:var(--ged);white-space:nowrap}
.vd .d-zfk{color:var(--info);font-size:13px;font-weight:600;margin:-8px 0 0 18px}
.vd .d-zf{margin:0 0 12px 18px;padding:10px 12px;background:var(--led);border-left:3px solid var(--info);font-size:14px;line-height:1.5;color:#C9D3E0}
.vd .d-zf .k{font-size:12px;font-weight:600;color:var(--info);margin-bottom:3px}
.vd .d-zf a{display:inline-block;margin-top:4px;color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.vd .d-ruhig{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:12px 0;border-top:3px solid var(--rand)}
.vd .d-ruhig b{font-family:"Big Shoulders Display",sans-serif;font-size:22px;font-weight:800;color:var(--ged)}
.vd .d-ruhig span{font-size:14px;color:var(--fehler)}
@container g (max-width:600px){
  .vd .dash{padding:22px 14px 36px;gap:32px}
  .vd .d-datum{font-size:52px}
  .vd .d-abs{grid-template-columns:1fr}
  .vd .d-abs h3{padding-top:10px;margin-bottom:2px}
  .vd .d-liste,.vd .d-tab,.vd .d-anz{padding-left:12px;padding-right:12px}
  .vd .d-zeile{grid-template-columns:48px minmax(0,1fr) auto}
  .vd .d-zeit{font-size:12px}
  .vd .d-paar{font-size:14px;gap:4px}
}

/* ================= E: Nachrichtenfluss ================= */
.ve{--grund:#18161F;--spalte:#221F2B;--text:#EEEAF3;--ged:#9D97A9;--rand:#322D3D;--or:#FF8A3D;--or-grund:rgba(255,138,61,.11);--info:#9CBEFF;--fehler:#FF9A8F;--kz-grund:#36303F;--kz-text:#DCD6E6;
  background:var(--grund);color:var(--text);font-family:"Schibsted Grotesk",system-ui,sans-serif;line-height:1.35}
.ve .dash{padding:28px 28px 44px;display:flex;flex-direction:column;gap:26px}
.ve .e-kopf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.ve .e-datum{font-family:Newsreader,Georgia,serif;font-size:38px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.ve .e-rechts{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--ged)}
.ve .e-abm{min-height:44px;padding:0 18px;border-radius:22px;background:var(--spalte);color:var(--text);font-weight:500}
.ve .e-haupt{display:grid;gap:32px;align-items:start}
@container g (min-width:900px){.ve .e-haupt{grid-template-columns:372px minmax(0,1fr);gap:44px}}
.ve .e-seite{background:var(--spalte);border-radius:18px;padding:16px 18px 6px;min-width:0}
.ve .e-seite>h2{font-size:21px;font-weight:700;padding:2px 0 4px}
.ve .e-kachel{padding:14px 0 16px;border-top:1px solid var(--rand);min-width:0}
.ve .e-seite>h2+.e-kachel{border-top:0;padding-top:6px}
.ve .e-kk{display:flex;align-items:center;gap:10px;margin-right:-10px}
.ve .marke{width:26px;height:26px;border-radius:6px;background:var(--m);color:var(--mt);font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.ve .e-kk h3{font-size:17px;font-weight:700;flex:1;min-width:0}
.ve .e-st{font-size:13px;color:var(--ged);margin:-4px 0 6px 36px}
.ve .e-p{display:grid;grid-template-columns:46px minmax(0,1fr) auto;column-gap:8px;align-items:center;min-height:38px;padding:4px 6px;margin:0 -6px;border-radius:8px}
.ve .e-zeit-p{font-size:12px;color:var(--ged);white-space:nowrap}
.ve .e-paar{display:flex;align-items:center;gap:4px;min-width:0;font-size:14px}
.ve .e-strich{color:var(--ged)}
.ve .e-erg{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ve .e-tore{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:0 12px;font-size:12.5px;color:var(--ged)}
.ve .e-p.mein{background:var(--or-grund);box-shadow:inset 3px 0 0 var(--or)}
.ve .team.mein .name{font-weight:700}
.ve .e-p.live .e-zeit-p,.ve .e-p.live .e-erg{color:var(--or);font-weight:700}
.ve .e-tabtitel{font-size:13px;color:var(--ged);margin:12px 0 2px}
.ve table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ve th{font-size:12px;font-weight:500;color:var(--ged);text-align:right;padding-bottom:3px}
.ve th.t-team{text-align:left}
.ve td{height:32px;padding:4px 0}
.ve td.pl{width:28px;text-align:right;color:var(--ged);padding-right:10px}
.ve td.t-team{max-width:0}
.ve td.z{width:34px;text-align:right;color:var(--ged)}
.ve td.pk{width:36px;text-align:right;font-weight:700;padding-right:6px}
.ve tr.mein td{background:var(--or-grund)}
.ve tr.mein td.pl{box-shadow:inset 3px 0 0 var(--or)}
.ve tr.grenze td{border-bottom:2px solid var(--c)}
.ve tr.luecke td{height:18px;padding:0;text-align:center;color:var(--ged);letter-spacing:.3em}
.ve .e-fehlt{font-size:13.5px;color:var(--ged);margin-top:8px}
.ve .e-fehler{margin:8px 0 2px;padding:12px 14px;border-radius:12px;background:var(--grund);font-size:14px;color:var(--ged)}
.ve .e-fehler b{color:var(--text);font-weight:600}
.ve .e-fehler .fehler-knopf{border-radius:22px;background:var(--spalte);color:var(--text);font-weight:500}
.ve .e-fluss{min-width:0}
.ve .e-fkopf{display:flex;align-items:center;justify-content:space-between}
.ve .e-fluss h2{font-family:Newsreader,Georgia,serif;font-size:32px;font-weight:600;line-height:1.1}
.ve .e-aus{font-size:14px;color:var(--ged);padding:6px 0 4px}
.ve .e-aus b{color:var(--text);font-weight:600}
.ve .e-aus span{color:var(--fehler)}
.ve .e-zeitraum{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:17px;color:var(--ged);padding:20px 0 6px;border-bottom:1px solid var(--rand)}
.ve .e-item{display:grid;grid-template-columns:54px 150px minmax(0,1fr);grid-template-areas:"zeit von inhalt";column-gap:14px;padding:4px 0;border-bottom:1px solid var(--rand);align-items:start}
.ve .e-zeit{grid-area:zeit;font-size:13px;color:var(--ged);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px;margin-top:14px}
.ve .e-zeit i{width:7px;height:7px;border-radius:50%;background:var(--or)}
.ve .e-von{grid-area:von;font-size:14px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:7px;border-left:3px solid var(--c);padding-left:9px;line-height:1.2;margin-top:13px}
.ve .e-von i{width:8px;height:8px;border-radius:2px;background:var(--m);flex-shrink:0}
.ve .e-inhalt{grid-area:inhalt;min-width:0}
.ve .e-titel{display:block;font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500;line-height:1.3;padding:10px 0}
.ve .e-zfk{color:var(--info);font-size:13px;font-weight:600;margin-top:-8px}
.ve .e-zf{margin:0 0 12px;padding:2px 0 2px 14px;border-left:2px solid var(--info);font-family:Newsreader,Georgia,serif;font-size:16.5px;line-height:1.55;color:#D5CFDF;max-width:62ch}
.ve .e-zf .k{font-family:"Schibsted Grotesk",sans-serif;font-size:12.5px;font-weight:600;color:var(--info)}
.ve .e-zf a{display:inline-block;margin-top:4px;font-family:"Schibsted Grotesk",sans-serif;font-size:14px;font-weight:600;color:var(--text);text-decoration:underline;text-underline-offset:3px}
@container g (max-width:600px){
  .ve .dash{padding:22px 14px 36px;gap:22px}
  .ve .e-datum{font-size:32px}
  .ve .e-seite{padding:14px 12px 4px;border-radius:14px}
  .ve .e-item{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"von zeit" "inhalt inhalt";padding-top:12px}
  .ve .e-zeit{justify-content:flex-end}
  .ve .e-zeit,.ve .e-von{margin-top:0}
  .ve .e-titel{padding:8px 0 13px;font-size:18px}
}

/* ================= F: Instrument ================= */
.vf{--grund:#171B22;--kante:#272D37;--text:#E4E7EC;--zinn:#8C95A3;--rauch:#69727F;--or:#FF8A3D;--or-grund:rgba(255,138,61,.08);--info:#86ABF5;--fehler:#F59A90;--kz-grund:#272D37;--kz-text:#B8C0CC;
  background:var(--grund);color:var(--text);font-family:Commissioner,system-ui,sans-serif;font-weight:380;line-height:1.4;font-variant-numeric:tabular-nums}
.vf .dash{padding:30px 36px 48px;display:flex;flex-direction:column;gap:52px}
.vf .f-kopf{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px}
.vf .f-datum{font-size:17px;font-weight:650;letter-spacing:-.005em}
.vf .f-datum span{color:var(--zinn);font-weight:380;margin-left:12px}
.vf .f-abm{min-height:44px;padding:0 14px;color:var(--zinn);font-weight:500;border-radius:8px}
.vf .f-abm:hover{background:var(--kante);color:var(--text)}
.vf .f-sk{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.vf h2{font-size:34px;font-weight:280;letter-spacing:-.02em;line-height:1}
.vf .f-raster{display:grid;gap:44px;align-items:start}
@container g (min-width:900px){.vf .f-raster{grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}}
.vf .f-kachel{min-width:0}
.vf .f-kk{display:flex;align-items:center;gap:10px;min-height:44px;margin-right:-12px}
.vf .f-kk i{width:9px;height:9px;border-radius:2px;background:var(--m);flex-shrink:0}
.vf .f-kk h3{font-size:16px;font-weight:720;flex:1;letter-spacing:-.005em}
.vf .neu-laden{color:var(--rauch);font-size:18px}
.vf .neu-laden:hover{color:var(--text);background:var(--kante)}
.vf .f-st{font-size:13px;color:var(--rauch);margin:-6px 0 10px 19px}
.vf .f-st b{color:var(--zinn);font-weight:600;margin-right:8px}
.vf .f-p{display:grid;grid-template-columns:50px minmax(0,1fr) 34px;column-gap:8px;align-items:center;min-height:36px;padding:3px 8px;margin:0 -8px;border-radius:6px}
.vf .f-zeit{font-size:12.5px;color:var(--zinn);white-space:nowrap}
.vf .f-paar{display:flex;align-items:center;gap:5px;min-width:0;font-size:14px;font-weight:420}
.vf .f-strich{color:var(--rauch)}
.vf .f-erg{text-align:right;font-size:14px;font-weight:700}

.vf th.t-team{text-align:left}

.vf .f-abs>div{max-width:760px}
.vf .f-mz{display:flex;align-items:baseline;gap:16px;position:relative}
.vf .f-ml{flex:1;min-width:0;display:block;font-size:15px;font-weight:430;padding:12px 0;line-height:1.4}
.vf .f-ml:hover .f-mt{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rauch)}
.vf .f-neu{position:absolute;left:-16px;top:19px;width:6px;height:6px;border-radius:50%}
.vf .f-neu.ja{background:var(--or)}
.vf .f-ma{font-size:12.5px;color:var(--rauch);white-space:nowrap}
.vf .f-zfk{color:var(--info);font-size:13px;font-weight:600;margin-top:-10px}
.vf .f-zf{margin:0 0 10px;padding-left:14px;border-left:1px solid var(--info);font-size:14.5px;line-height:1.6;color:#C3CAD5;max-width:66ch}
.vf .f-zf .k{font-size:12.5px;font-weight:600;color:var(--info)}
.vf .f-zf a{display:inline-block;margin-top:4px;font-weight:600;color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rauch)}

.vf .f-ruhig p{padding-top:12px;font-size:14px;color:var(--fehler)}
@container g (max-width:600px){
  .vf .dash{padding:22px 18px 36px;gap:40px}
  .vf h2{font-size:30px}
  .vf .f-abs{grid-template-columns:minmax(0,1fr);padding-left:16px}
  .vf .f-an{font-size:18px;padding-top:4px;margin-left:-16px}
  .vf .f-ruhig p{padding-top:4px}
  .vf .f-p{grid-template-columns:52px minmax(0,1fr) 30px;column-gap:6px}
  .vf .f-kopf{flex-wrap:nowrap}
  .vf .f-datum span{display:block;margin-left:0}
  .vf .f-paar{gap:4px}
}

<body>
<div class="mock-kopf" id="mock-kopf">

  <p><span class="beispiel">Beispieldaten</span>Alle Spiele, Tabellen, Torschützen und Meldungen sind erfunden (Stand angenommen: Sonntag, 22. November 2026, 17:42), übernommen aus Mock B2. Teams als neutrale Kürzel-Kreise statt Logos.</p>

  </div>
</div>

<script>
const VARIANTEN = [
  {id:"d", name:"D: Anzeigetafel", text:"Jede Sport-Kachel öffnet mit einer Tafel für laufende Partien und Mein Team, das Ergebnis ist das Größte auf der Seite. Wettbewerbe als volle Farbbänder, die Tabelle als Leiste aus Feldern, Absender mit großem farbigem Namen."},
  {id:"e", name:"E: Nachrichtenfluss", text:"Die KI-News laufen als ein Fluss nach Uhrzeit, jede Meldung trägt ihren Absender als farbige Spalte. Sport steht als schmale Spalte links und auf dem iPhone oben."},
  {id:"f", name:"F: Instrument", text:"Keine Kästen: Ordnung nur über Schriftgewicht, Größe und Abstand. Die Absender hängen farbig in einer eigenen Spalte links neben ihren Meldungen."},

// [Akzent (Linie, Name), Marke falls abweichend, Schrift auf Marke/Band] – Farbtabelle aus B2
const FARBEN = {

  "OpenAI":["#ECECEC",null,"#0e1013"],
  "Google DeepMind":["#4285F4",null,"#fff"],
  "The Verge":["#9479FF",null,"#fff"],
  "Hacker News":["#B5B5AA","#FF6600","#fff"],
  "The Decoder":["#7FA8AE",null,"#0e1013"],
  "Andrej Karpathy":["#8F9AAD",null,"#0e1013"],
  "Matt Pocock":["#A3A08F",null,"#0e1013"]};
const MARKEN = {"Bundesliga":"BL","Premier League":"PL","Champions League":"CL"};
const KZ = {"Man City":"MCI","Man United":"MUN","Aston Villa":"AVL","Crystal Palace":"CRY","Real Madrid":"RMA","Inter Milan":"INT","AS Roma":"ROM","Club Brugge":"BRU","S Bratislava":"SBR","Slavia Prague":"SLA","LASK Linz":"LAS","AEK Athens":"AEK","FC Porto":"POR","Bodo/Glimt":"BOD","Leverkusen":"B04","Gladbach":"BMG","Frankfurt":"SGE","Hoffenheim":"TSG","Tottenham":"TOT","Nottingham":"NFO","Bayern":"FCB","Dortmund":"BVB","Leipzig":"RBL","Stuttgart":"VFB","Liverpool":"LIV","Chelsea":"CHE","Arsenal":"ARS","Brighton":"BHA","Inter Milan":"INT"};
const kz = n => KZ[n] || n.normalize("NFD").replace(/[̀-ͯ]/g,"").slice(0,3).toUpperCase();

const WETTBEWERBE = [
  {titel:"Bundesliga", mein:["Bayern"], grenzen:[4,5,6,15,16],
   spieltag:"11. Spieltag · Fr 20. – So 22. November",
   partien:[
    ["Fr 20:30","Dortmund","Leipzig","2:1","Guirassy 12', 67' · Openda 40'"],
    ["Sa 15:30","Bayern","Freiburg","3:0","Kane 8', 54' · Olise 71'"],
    ["Sa 15:30","Leverkusen","Bremen","1:1","Schick 33' · Grüll 81'"],
    ["Sa 15:30","Stuttgart","HSV","2:0","Demirović 19' · Undav 88'"],
    ["Sa 15:30","Mainz","Elversberg","0:0",""],
    ["Sa 18:30","Frankfurt","Gladbach","2:2","Burkardt 5' · Kleindienst 28', 60' · Uzun 90+2'"],
    ["So 15:30","Augsburg","Paderborn","1:0","Claude-Maurice 77'"],
    ["live 56'","Hoffenheim","Union","1:0","Kramarić 23'"],
    ["So 19:30","Schalke","Köln","",""]],
   tabelle:[[1,"Dortmund",11,"+14",26],null,[3,"Leipzig",11,"+9",22],[4,"Leverkusen",11,"+7",21],[5,"Bayern",11,"+10",20],[6,"Stuttgart",11,"+4",19],[7,"Frankfurt",11,"+2",17]]},
  {titel:"Premier League", mein:["Arsenal"], grenzen:[4,5,6,17],
   spieltag:"12. Spieltag · Sa 21. – Mo 23. November",
   partien:[
    ["Sa 13:30","Chelsea","Everton","2:0","Palmer 22' · João Pedro 64'"],
    ["Sa 16:00","Arsenal","Tottenham","3:1","Saka 14' · Ødegaard 38' · Kudus 52' · Gyökeres 76'"],
    ["Sa 16:00","Brighton","Leeds","1:1","Welbeck 9' · Calvert-Lewin 70'"],
    ["Sa 16:00","Fulham","Hull","2:0","Iwobi 31' · Jiménez 58'"],
    ["Sa 18:30","Man City","Newcastle","1:0","Haaland 44'"],
    ["So 15:00","Liverpool","Aston Villa","2:2","Salah 17' · Watkins 40', 66' · Isak 85'"],
    ["So 15:00","Ipswich","Coventry","0:1","Wright 61'"],
    ["live 71'","Brentford","Bournemouth","1:1","Thiago 12' · Kluivert 49'"],
    ["Mo 21:00","Nottingham","Crystal Palace","",""],
    ["Mo 21:00","Sunderland","Man United","",""]],
   tabelle:[[1,"Man City",12,"+15",28],[2,"Liverpool",12,"+12",25],[3,"Arsenal",12,"+13",25],[4,"Chelsea",12,"+8",22],[5,"Brighton",12,"+5",21]]},
  {titel:"Champions League", mein:["Bayern","Arsenal"], grenzen:[8,24],
   spieltag:"5. Spieltag · Di 24. – Mi 25. November",
   partien:[
    ["Di 18:45","Bodo/Glimt","Sporting"],["Di 18:45","Sabah","Lille"],
    ["Di 21:00","Bayern","PSG"],["Di 21:00","Barcelona","Napoli"],["Di 21:00","Liverpool","Atlético"],["Di 21:00","Dortmund","Villarreal"],
    ["Di 21:00","PSV","Galatasaray"],["Di 21:00","Club Brugge","Leipzig"],["Di 21:00","Slavia Prague","Man City"],
    ["Mi 18:45","Fenerbahce","Como"],["Mi 18:45","Viking FK","Shakhtar"],
    ["Mi 21:00","Arsenal","Inter Milan"],["Mi 21:00","Real Madrid","Aston Villa"],["Mi 21:00","Stuttgart","FC Porto"],["Mi 21:00","AS Roma","Feyenoord"],
    ["Mi 21:00","Lens","Man United"],["Mi 21:00","Betis","AEK Athens"],["Mi 21:00","LASK Linz","S Bratislava"]],
   tabelle:[[1,"Liverpool",4,"+10",12],[2,"Arsenal",4,"+8",10],[3,"Real Madrid",4,"+7",10],[4,"Inter Milan",4,"+6",9],null,[7,"PSG",4,"+3",8],[8,"Man City",4,"+3",7],[9,"Bayern",4,"+2",7],[10,"Dortmund",4,"+1",7],[11,"Napoli",4,"0",6]]},
];

// min = Minuten vor 17:42 (für die Sortierung im Fluss)
const KI = {
  aktiv:[
    {name:"Anthropic", meldungen:[
      {t:"Introducing Claude for Life Sciences 2", a:"vor 4 Std.", min:242, neu:true},
      {t:"Measuring agent reliability over long tasks", a:"vor 2 Tagen", min:2950}]},
    {name:"Claude Updates", meldungen:[
      {t:"Claude Code 2.4: background agents for all plans", a:"vor 3 Std.", min:186, neu:true, z:"Claude Code kann Aufgaben jetzt in allen Tarifen im Hintergrund weiterlaufen lassen. Ergebnisse erscheinen als Benachrichtigung, sobald der Agent fertig ist."},
      {t:"API: Message Batches now keep results for 7 days", a:"gestern", min:1580},
      {t:"Shared projects for Claude Team", a:"vor 3 Tagen", min:4400}]},
    {name:"OpenAI", meldungen:[
      {t:"Introducing GPT-5.5 mini", a:"vor 5 Std.", min:302, neu:true, z:"Ein kleineres, günstigeres Modell der GPT-5.5-Reihe, gedacht für schnelle Antworten in Apps. Laut OpenAI nahe am großen Modell bei Programmieraufgaben."},
      {t:"Codex now runs in your browser", a:"vor 4 Tagen", min:5800}]},
    {name:"Google DeepMind", meldungen:[
      {t:"Gemini 3 Ultra: thinking at scale", a:"vor 9 Std.", min:545, neu:true},
      {t:"AlphaFold 4 opens protein complexes to researchers", a:"vor 2 Tagen", min:3010}]},
    {name:"Andrej Karpathy", meldungen:[
      {t:"Software 3.5", a:"gestern", min:1650, neu:true},
      {t:"Let's build a tokenizer, revisited (video)", a:"vor 6 Tagen", min:8700}]},
    {name:"The Decoder", meldungen:[
      {t:"Anthropic stellt neues Modell für Unternehmen vor", a:"vor 40 Min.", min:40, neu:true},
      {t:"EU AI Act: Was ab Januar für Anbieter gilt", a:"vor 7 Std.", min:425, neu:true},
      {t:"Studie: KI-Agenten scheitern oft an langen Aufgaben", a:"gestern", min:1520}]},
    {name:"The Verge", meldungen:[
      {t:"Apple's Siri overhaul arrives in iOS 27.2 beta", a:"vor 2 Std.", min:118, neu:true},
      {t:"Meta's new glasses translate conversations in real time", a:"gestern", min:1460}]},
    {name:"Hacker News", meldungen:[
      {t:"Show HN: A local-first notebook for LLM experiments", a:"vor 1 Std.", min:61, neu:true}]},
  ],
  aus:[{name:"Matt Pocock", text:"gerade nicht erreichbar, neuer Versuch in 5 Minuten"}],
};
// Abschnitt mit der neuesten Meldung oben (Projektvision)
const ABSENDER = [...KI.aktiv].sort((x,y)=>Math.min(...x.meldungen.map(m=>m.min))-Math.min(...y.meldungen.map(m=>m.min)));

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const stil = n => { const f = FARBEN[n] || ["#8E99A8",null,"#0e1013"]; return `--c:${f[0]};--m:${f[1]||f[0]};--mt:${f[2]}`; };
const istLive = z => z.startsWith("live");
const minute = z => z.slice(5);
const teile = s => s.includes(" · ") ? s.split(" · ") : ["", s];
const toreHtml = t => t.split(" · ").map(x=>`<span>${esc(x)}</span>`).join("");
const team = (n, mein) => `<span class="team${mein?" mein":""}"><i class="kz">${kz(n)}</i><span class="name">${esc(n)}</span></span>`;
const NEU_LADEN = t => `<button class="neu-laden" aria-label="${t} neu laden" title="Frisch von den Quellen holen">↻</button>`;
const PFEIL = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let zfNr = 0;
function zusammenfassung(m, v){
  if (!m.z) return "";
  const id = "zf" + (++zfNr);
  return `<button class="zf-knopf ${v}-zfk" aria-expanded="false" aria-controls="${id}">Zusammenfassung${PFEIL}</button>
    <div class="${v}-zf" id="${id}" hidden><p class="k">KI-Zusammenfassung</p><p>${esc(m.z)}</p><a href="#">Artikel öffnen</a></div>`;
}
function grenzeNach(w, z, i){ const n = w.tabelle[i+1]; return w.grenzen.includes(z[0]) && n && n[0] === z[0]+1; }
function tabelleHtml(w, v){
  if (w.tabelle === null) return `<p class="${v}-fehlt">Tabelle gerade nicht erreichbar</p>`;
  const zeilen = w.tabelle.map((z,i) => {
    if (!z) return `<tr class="luecke"><td colspan="5">···</td></tr>`;
    const mein = w.mein.includes(z[1]);
    return `<tr class="${mein?"mein ":""}${grenzeNach(w,z,i)?"grenze":""}"><td class="pl">${z[0]}</td><td class="t-team">${team(z[1],mein)}</td><td class="z">${z[2]}</td><td class="z">${z[3]}</td><td class="pk">${z[4]}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th></th><th class="t-team"></th><th>Sp</th><th>+/−</th><th>Pkt</th></tr></thead><tbody>${zeilen}</tbody></table>`;
}
const fehlerText = t => `<b>${t} gerade nicht erreichbar.</b> Letzter Versuch 17:41, nächster in einer Minute.`;

/* ---------- D ---------- */
function dAnzeige(p, w){
  const [zeit,h,g,erg="",tore=""] = p;
  const live = istLive(zeit), [eh,eg] = erg ? erg.split(":") : ["",""];
  const mH = w.mein.includes(h), mG = w.mein.includes(g);
  const status = live ? `<span class="d-live"><i></i>Live, ${minute(zeit)}</span>` : (erg ? `${zeit}, Endstand` : `Anstoß ${zeit}`);
  return `<div class="d-anz${live?" live":""}${mH||mG?" mein":""}"><p class="d-status">${status}</p>
    ${[[h,eh,mH],[g,eg,mG]].map(([n,t,m])=>`<div class="d-team${m?" ist-mein":""}"><i class="kz">${kz(n)}</i><span class="name">${esc(n)}</span><b class="d-tor">${t}</b></div>`).join("")}
    ${tore?`<p class="d-tore">${toreHtml(tore)}</p>`:""}</div>`;
}
function dZeile(p, w){
  const [zeit,h,g,erg="",tore=""] = p;
  return `<div class="d-zeile"><span class="d-zeit">${zeit}</span><span class="d-paar">${team(h,w.mein.includes(h))}<span class="d-strich">–</span>${team(g,w.mein.includes(g))}</span><span class="d-erg">${erg.replace(":", "–")}</span>${tore?`<p class="d-tore">${toreHtml(tore)}</p>`:""}</div>`;
}
function dLeiste(w){
  if (w.tabelle === null) return `<p class="d-fehlt">Tabelle gerade nicht erreichbar</p>`;
  let h = "";
  w.tabelle.forEach((z,i) => {
    if (!z) { h += `<div class="d-zelle luecke" role="listitem" aria-label="Plätze ausgelassen">···</div>`; return; }
    const mein = w.mein.includes(z[1]);
    h += `<div class="d-zelle${mein?" mein":""}" role="listitem" title="${esc(z[1])}"><span class="pl">${z[0]}.</span><b>${kz(z[1])}</b><span class="pk">${z[4]}</span><span class="td">${z[3]}</span></div>`;
    if (grenzeNach(w,z,i)) h += `<i class="d-grenze" aria-label="Grenze nach Platz ${z[0]}"></i>`;
  });
  return `<div class="d-leiste" role="list">${h}</div>`;
}
function dKachel(w, fz){
  const tafel = w.partien.filter(p => istLive(p[0]) || w.mein.includes(p[1]) || w.mein.includes(p[2])).sort((a,b)=>istLive(b[0])-istLive(a[0]));
  const rest = w.partien.filter(p => !tafel.includes(p));
  const [nr, tage] = teile(w.spieltag);
  return `<section class="d-kachel" style="${stil(w.titel)}" aria-label="${w.titel}">
    <header class="d-band"><h3>${w.titel}</h3><span class="d-nr">${nr?nr+"<br>":""}${tage}</span>${NEU_LADEN(w.titel)}</header>
    ${fz?`<div class="d-fehler" role="status"><p>${fehlerText(w.titel)}</p><button class="fehler-knopf">Jetzt neu laden</button></div>`:""}
    ${tafel.length?`<div class="d-tafel">${tafel.map(p=>dAnzeige(p,w)).join("")}</div>`:""}
    ${rest.length?`<div class="d-liste">${rest.map(p=>dZeile(p,w)).join("")}</div>`:""}
    ${fz?"":`<div class="d-tab"><p>Tabelle, Plätze mit Punkten</p>${dLeiste(w)}</div>`}</section>`;
}
function dMeldung(m){
  return `<div class="d-m"><div class="d-mz"><a href="#" class="d-ml"><span class="d-neu${m.neu?" ja":""}"${m.neu?' role="img" aria-label="neu"':""}></span><span class="d-mt">${esc(m.t)}</span></a><span class="d-ma">${m.a}</span></div>${zusammenfassung(m,"d")}</div>`;
}
function dDash(){
  return `<div class="dash">
    <header class="d-kopf"><p class="d-datum"><span>Sonntag</span>22. November</p><div class="d-rechts"><span>Stand 17:42</span><button class="d-abm">Abmelden</button></div></header>
    <section class="d-gruppe" aria-label="Sport"><h2>Sport</h2><div class="d-raster">${WETTBEWERBE.map(w=>dKachel(w)).join("")}</div></section>
    <section class="d-ki" aria-label="KI-News"><div class="d-gkopf"><h2>KI-News</h2>${NEU_LADEN("KI-News")}</div>
      <div class="d-absender">${ABSENDER.map(a=>`<div class="d-abs" style="${stil(a.name)}"><h3><i></i>${a.name}</h3><div>${a.meldungen.map(dMeldung).join("")}</div></div>`).join("")}
      ${KI.aus.map(r=>`<div class="d-ruhig"><b>${r.name}</b><span>${r.text}</span></div>`).join("")}</div></section>
    <p class="zust-hinweis">Weitere Zustände (Beispiel): Kachel ohne Daten, Kachel ohne Tabelle</p>
    <div class="d-raster">${dKachel({...WETTBEWERBE[1], partien:[]}, true)}${dKachel(ohneTabelle())}</div>
  </div>`;
}
const ohneTabelle = () => ({...WETTBEWERBE[2], tabelle:null, spieltag:"Di 24. – Mi 25. November", partien:WETTBEWERBE[2].partien.slice(2,4)});

/* ---------- E ---------- */
function eKachel(w, fz){
  const [nr, tage] = teile(w.spieltag);
  const partien = w.partien.map(p => {
    const [zeit,h,g,erg="",tore=""] = p; const live = istLive(zeit);
    const mH = w.mein.includes(h), mG = w.mein.includes(g);
    return `<div class="e-p${mH||mG?" mein":""}${live?" live":""}"><span class="e-zeit-p">${live?`● ${minute(zeit)}`:zeit}</span><span class="e-paar">${team(h,mH)}<span class="e-strich">–</span>${team(g,mG)}</span><span class="e-erg">${erg}</span>${tore?`<p class="e-tore">${toreHtml(tore)}</p>`:""}</div>`;
  }).join("");
  return `<section class="e-kachel" style="${stil(w.titel)}" aria-label="${w.titel}">
    <div class="e-kk"><span class="marke" aria-hidden="true">${MARKEN[w.titel]}</span><h3>${w.titel}</h3>${NEU_LADEN(w.titel)}</div>
    <p class="e-st">${nr?nr+", ":""}${tage}</p>
    ${fz?`<div class="e-fehler" role="status">${fehlerText(w.titel)}<br><button class="fehler-knopf">Jetzt neu laden</button></div>`:""}
    ${partien}${fz?"":`<p class="e-tabtitel">Tabelle</p>${tabelleHtml(w,"e")}`}</section>`;
}
const TAGE = ["So","Sa","Fr","Do","Mi","Di","Mo"];
function eZeit(min){
  const t = 17*60+42 - min;
  const hm = x => `${String(Math.floor(x/60)).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;
  if (t >= 0) return hm(t);
  const tag = Math.ceil(-t/1440);
  return tag === 1 ? hm(t+1440) : TAGE[tag];
}
const eRaum = min => min <= 61 ? "Letzte Stunde" : min <= 17*60+42 ? "Heute, früher" : min <= 17*60+42+1440 ? "Gestern" : "Diese Woche";
function eFluss(){
  const alle = KI.aktiv.flatMap(a => a.meldungen.map(m => ({...m, von:a.name}))).sort((x,y)=>x.min-y.min);
  let raum = "", h = "";
  for (const m of alle){
    const r = eRaum(m.min);
    if (r !== raum){ h += `<h3 class="e-zeitraum">${r}</h3>`; raum = r; }
    h += `<article class="e-item" style="${stil(m.von)}"><span class="e-zeit">${m.neu?'<i role="img" aria-label="neu"></i>':""}${eZeit(m.min)}</span><span class="e-von"><i></i>${m.von}</span>
      <div class="e-inhalt"><a href="#" class="e-titel">${esc(m.t)}</a>${zusammenfassung(m,"e")}</div></article>`;
  }
  return h;
}
function eDash(){
  return `<div class="dash">
    <header class="e-kopf"><p class="e-datum">Sonntag, 22. November</p><div class="e-rechts"><span>Stand 17:42</span><button class="e-abm">Abmelden</button></div></header>
    <div class="e-haupt">
      <aside class="e-seite" aria-label="Sport"><h2>Sport</h2>${WETTBEWERBE.map(w=>eKachel(w)).join("")}</aside>
      <section class="e-fluss" aria-label="KI-News"><div class="e-fkopf"><h2>KI-News</h2>${NEU_LADEN("KI-News")}</div>
        ${KI.aus.map(r=>`<p class="e-aus"><b>${r.name}</b> <span>${r.text}</span></p>`).join("")}
        ${eFluss()}</section>
    </div>
    <p class="zust-hinweis">Weitere Zustände (Beispiel): Kachel ohne Daten, Kachel ohne Tabelle</p>
    <div class="e-seite" style="max-width:372px">${eKachel({...WETTBEWERBE[1], partien:[]}, true)}${eKachel(ohneTabelle())}</div>
  </div>`;
}

/* ---------- F ---------- */
function fKachel(w, fz){
  const [nr, tage] = teile(w.spieltag);
  const partien = w.partien.map(p => {
    const [zeit,h,g,erg="",tore=""] = p; const live = istLive(zeit);
    const mH = w.mein.includes(h), mG = w.mein.includes(g);
    return `<div class="f-p${mH||mG?" mein":""}${live?" live":""}"><span class="f-zeit">${live?`● ${minute(zeit)}`:zeit}</span><span class="f-paar">${team(h,mH)}<span class="f-strich">–</span>${team(g,mG)}</span><span class="f-erg">${erg}</span>${tore?`<p class="f-tore">${toreHtml(tore)}</p>`:""}</div>`;
  }).join("");
  return `<section class="f-kachel" style="${stil(w.titel)}" aria-label="${w.titel}">
    <div class="f-kk"><i aria-hidden="true"></i><h3>${w.titel}</h3>${NEU_LADEN(w.titel)}</div>
    <p class="f-st">${nr?`<b>${nr}</b>`:""}${tage}</p>
    ${fz?`<div class="f-fehler" role="status">${fehlerText(w.titel)}<br><button class="fehler-knopf">Jetzt neu laden</button></div>`:""}
    ${partien}${fz?"":`<p class="f-tabtitel">Tabelle</p>${tabelleHtml(w,"f")}`}</section>`;
}
function fMeldung(m){
  return `<div class="f-m"><div class="f-mz"><span class="f-neu${m.neu?" ja":""}"${m.neu?' role="img" aria-label="neu"':""}></span><a href="#" class="f-ml"><span class="f-mt">${esc(m.t)}</span></a><span class="f-ma">${m.a}</span></div>${zusammenfassung(m,"f")}</div>`;
}
function fDash(){
  return `<div class="dash">
    <header class="f-kopf"><p class="f-datum">Sonntag, 22. November<span>Stand 17:42</span></p><button class="f-abm">Abmelden</button></header>
    <section aria-label="Sport"><div class="f-sk"><h2>Sport</h2></div><div class="f-raster">${WETTBEWERBE.map(w=>fKachel(w)).join("")}</div></section>
    <section aria-label="KI-News"><div class="f-sk"><h2>KI-News</h2>${NEU_LADEN("KI-News")}</div>
      ${ABSENDER.map(a=>`<div class="f-abs" style="${stil(a.name)}"><h3 class="f-an"><i aria-hidden="true"></i>${a.name}</h3><div>${a.meldungen.map(fMeldung).join("")}</div></div>`).join("")}
      ${KI.aus.map(r=>`<div class="f-abs f-ruhig"><h3 class="f-an">${r.name}</h3><p>${r.text}</p></div>`).join("")}</section>
    <p class="zust-hinweis">Weitere Zustände (Beispiel): Kachel ohne Daten, Kachel ohne Tabelle</p>
    <div class="f-raster">${fKachel({...WETTBEWERBE[1], partien:[]}, true)}${fKachel(ohneTabelle())}</div>
  </div>`;
}

const DASH = {d:dDash, e:eDash, f:fDash};
const q = new URLSearchParams(location.search);
const stand = {v:q.get("v")||"alle", b:q.get("b")||"1200"};
if (q.get("ohnekopf")) document.getElementById("mock-kopf").style.display = "none";

function zeichnen(){
  zfNr = 0;
  const liste = stand.v === "alle" ? VARIANTEN : VARIANTEN.filter(x => x.id === stand.v);
  const b = document.getElementById("buehne");
  b.className = `breite-${stand.b}${stand.v==="alle"?"":" nur-eine"}`;
  b.innerHTML = liste.map(x => `<div class="variante-block"><div class="variante-titel"><h2>${x.name}</h2><p>${x.text}</p></div><div class="geraet"><div class="v${x.id}">${DASH[x.id]()}</div></div></div>`).join("");
  document.querySelectorAll(".schalter-gruppe").forEach(g => g.querySelectorAll("button").forEach(k => k.classList.toggle("an", k.dataset.wert === stand[g.dataset.schalter])));
  // Erste Zusammenfassung je Variante offen, damit der Kasten im Bild steht.
  b.querySelectorAll(".variante-block").forEach(bl => { const k = bl.querySelector(".zf-knopf"); if (k) oeffnen(k); });
  document.title = "H" + document.documentElement.scrollHeight;
}
function oeffnen(k){ const kasten = document.getElementById(k.getAttribute("aria-controls")); const offen = k.getAttribute("aria-expanded") !== "true"; k.setAttribute("aria-expanded", offen); kasten.hidden = !offen; }
document.addEventListener("click", e => {
  const s = e.target.closest(".schalter-gruppe button");
  if (s){ stand[s.parentElement.dataset.schalter] = s.dataset.wert; zeichnen(); return; }
  const k = e.target.closest(".zf-knopf"); if (k){ oeffnen(k); return; }
  if (e.target.closest("a[href='#']")) e.preventDefault();
});
zeichnen();
document.fonts && document.fonts.ready.then(() => { document.title = "H" + document.documentElement.scrollHeight; });
if (q.get("pruef")) setTimeout(()=>{const g=document.querySelector(".geraet").getBoundingClientRect();let ueber=[];document.querySelectorAll(".geraet *").forEach(e=>{const r=e.getBoundingClientRect();if(r.width&&r.right>g.right+0.5&&!e.closest(".name"))ueber.push(e.className||e.tagName)});let klein=[];document.querySelectorAll(".geraet button,.geraet a").forEach(e=>{const r=e.getBoundingClientRect();if(r.height<43.5)klein.push((e.className||"a")+":"+Math.round(r.height))});document.title="U"+ueber.length+" "+ueber.slice(0,5).join("|")+" K"+klein.length+" "+[...new Set(klein)].slice(0,6).join("|");},1500);
</script>
</body>
