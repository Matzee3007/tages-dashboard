# Zusammenfassungen der KI-News und Spielberichte auf dem Mac (ADR 0010, ADR 0013): docker compose up --build -d
services:
  zusammenfassen:
    build:
      context: .
      dockerfile: zusammenfassen/Dockerfile
    restart: unless-stopped
    # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY und ZUSAMMENFASSEN_EMAIL
    env_file: .env.local
    secrets:
      - supabase_passwort
    models:
      llm:
        endpoint_var: MODELL_URL
        model_var: MODELL_NAME

models:
  llm:
    # Seit 2026-11-17 für beides: qwen3:4b fiel bei den Spielberichten durch, auf 16 GB passt nur ein Modell (ADR 0013).
    # Bei den Zusammenfassungen laut Evaluation vom 2026-11-15 so gut wie qwen3:4b, nur etwa dreimal so langsam.
    model: ai/gemma4:e4b
    context_size: 8192

secrets:
  supabase_passwort:
    file: ./.secrets/supabase-passwort
